<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikidata QID Lookup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f1f0ec;
    --border: #e2e0d8;
    --border2: #ccc9bf;
    --text: #1a1917;
    --text2: #6b6860;
    --text3: #9b9890;
    --accent: #2a5bd7;
    --accent-bg: #edf2fd;
    --accent-text: #1a3d9f;
    --green-bg: #eaf3de;
    --green-text: #2e5c0e;
    --blue-bg: #e6f0fb;
    --blue-text: #164e9e;
    --success-bg: #d6f0e0;
    --success-text: #1a6637;
    --mono: 'Courier New', Courier, monospace;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-pill: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1b19;
      --surface2: #252420;
      --border: #2e2d29;
      --border2: #3d3c37;
      --text: #e8e6df;
      --text2: #8a8880;
      --text3: #5a5855;
      --accent: #6b9ef5;
      --accent-bg: #1a2540;
      --accent-text: #8bb4f8;
      --green-bg: #162510;
      --green-text: #7ec858;
      --blue-bg: #101e38;
      --blue-text: #7aadfa;
      --success-bg: #0e2b1a;
      --success-text: #5fcf88;
      --mono: 'Courier New', Courier, monospace;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--text);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { fill: var(--bg); }

  h1 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text2);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-style: italic;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  input[type="text"] {
    flex: 1;
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 11px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text3); }

  button.primary {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 11px 22px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  button.primary:hover { opacity: 0.8; }
  button.primary:active { opacity: 0.65; transform: scale(0.98); }

  .lang-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .lang-label {
    font-size: 12px;
    color: var(--text3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .lang-check {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text2);
  }

  .lang-check input { cursor: pointer; accent-color: var(--accent); }

  .pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.03em;
  }

  .pill-pt { background: var(--green-bg); color: var(--green-text); }
  .pill-en { background: var(--blue-bg); color: var(--blue-text); }

  #status {
    font-size: 13px;
    color: var(--text3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 22px;
    margin-bottom: 8px;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: border-color 0.15s;
  }

  .result-card:hover { border-color: var(--border2); }

  .card-body { flex: 1; min-width: 0; }

  .card-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .card-title {
    font-size: 15px;
    font-weight: normal;
    color: var(--text);
  }

  .card-desc {
    font-size: 13px;
    color: var(--text2);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-bottom: 7px;
    line-height: 1.5;
  }

  .aliases { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }

  .alias-tag {
    font-size: 11px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .card-link {
    font-size: 12px;
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-decoration: none;
  }

  .card-link:hover { text-decoration: underline; }

  .card-right {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }

  .qid-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    background: var(--accent-bg);
    color: var(--accent-text);
    border: 1px solid transparent;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s;
  }

  .qid-btn:hover { border-color: var(--accent); }

  .qid-btn.copied {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .copy-hint {
    font-size: 10px;
    color: var(--text3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
  }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
  }

  footer a { color: var(--text3); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-row">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
      </div>
      <h1>Wikidata QID Lookup</h1>
    </div>
    <p class="subtitle">Busca de identificadores Q por nome, sinônimos e aliases em português e inglês</p>
  </header>

  <div class="search-row">
    <input type="text" id="q" placeholder="Digite o nome da entidade... ex: Organização Mundial da Saúde" autocomplete="off" />
    <button class="primary" onclick="search()">Buscar</button>
  </div>

  <div class="lang-row">
    <span class="lang-label">Buscar em:</span>
    <label class="lang-check">
      <input type="checkbox" id="lang_pt" checked>
      <span class="pill pill-pt">pt</span> Português
    </label>
    <label class="lang-check">
      <input type="checkbox" id="lang_en" checked>
      <span class="pill pill-en">en</span> Inglês
    </label>
  </div>

  <div id="status"></div>
  <div id="results">
    <div class="empty-state">Digite o nome de uma entidade e pressione Buscar</div>
  </div>

  <footer>
    Dados via <a href="https://www.wikidata.org" target="_blank">Wikidata</a> (API pública) &mdash; nenhum dado é armazenado localmente
  </footer>

</div>

<script>
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  async function fetchLang(term, lang) {
    const url = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(term)}&language=${lang}&uselang=${lang}&limit=10&format=json&origin=*`;
    const r = await fetch(url);
    const j = await r.json();
    return (j.search || []).map(x => ({ ...x, _lang: lang }));
  }

  async function search() {
    const term = document.getElementById('q').value.trim();
    if (!term) return;
    const usePt = document.getElementById('lang_pt').checked;
    const useEn = document.getElementById('lang_en').checked;
    if (!usePt && !useEn) {
      document.getElementById('status').textContent = 'Selecione ao menos um idioma.';
      return;
    }

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    statusEl.innerHTML = '<span class="spinner"></span> Buscando no Wikidata...';
    resultsEl.innerHTML = '';

    try {
      const fetches = [];
      if (usePt) fetches.push(fetchLang(term, 'pt'));
      if (useEn) fetches.push(fetchLang(term, 'en'));
      const arrays = await Promise.all(fetches);

      const seen = new Set();
      const byQid = {};
      const merged = [];

      arrays.forEach(arr => arr.forEach(item => {
        if (!byQid[item.id]) byQid[item.id] = { langs: [], item };
        byQid[item.id].langs.push(item._lang);
        if (!seen.has(item.id)) { seen.add(item.id); merged.push(item); }
      }));

      if (merged.length === 0) {
        statusEl.textContent = 'Nenhum resultado encontrado.';
        resultsEl.innerHTML = '<div class="empty-state">Tente variações do nome ou abreviações</div>';
        return;
      }

      statusEl.textContent = `${merged.length} resultado(s) encontrado(s)`;

      merged.forEach(item => {
        const langs = byQid[item.id].langs;
        const aliases = (item.aliases || []).slice(0, 8);
        const card = document.createElement('div');
        card.className = 'result-card';

        const langPills = langs.map(l =>
          `<span class="pill pill-${l}">${l}</span>`
        ).join('');

        const aliasHtml = aliases.length
          ? `<div class="aliases">${aliases.map(a => `<span class="alias-tag">${a}</span>`).join('')}</div>`
          : '';

        const descHtml = item.description
          ? `<div class="card-desc">${item.description}</div>`
          : '';

        const linkHtml = item.url
          ? `<a class="card-link" href="${item.url}" target="_blank">wikidata.org/wiki/${item.id} ↗</a>`
          : '';

        card.innerHTML = `
          <div class="card-body">
            <div class="card-title-row">
              <span class="card-title">${item.label || item.id}</span>
              ${langPills}
            </div>
            ${descHtml}
            ${aliasHtml}
            ${linkHtml}
          </div>
          <div class="card-right">
            <button class="qid-btn" id="copy_${item.id}" onclick="copyQid('${item.id}')">${item.id}</button>
            <span class="copy-hint">clique para copiar</span>
          </div>`;

        resultsEl.appendChild(card);
      });
    } catch (e) {
      statusEl.textContent = 'Erro ao conectar com o Wikidata. Verifique sua conexão.';
      resultsEl.innerHTML = '<div class="empty-state">Tente novamente em alguns instantes</div>';
    }
  }

  function copyQid(qid) {
    navigator.clipboard.writeText(qid).then(() => {
      const btn = document.getElementById('copy_' + qid);
      const orig = btn.textContent;
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>
</body>
</html>
